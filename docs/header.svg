      <animate attributeName="ry" values="85;110;70;85" keyTimes="0;0.34;0.67;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" dur="14.4s" begin="-7s" repeatCount="indefinite"/>
