      <animate attributeName="ry" values="95;115;85;95" keyTimes="0;0.34;0.67;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" dur="16s" begin="-2s" repeatCount="indefinite"/>
