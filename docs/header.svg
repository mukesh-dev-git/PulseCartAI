<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="PulseCart AI">
  <defs>
    <filter id="soft" filterUnits="userSpaceOnUse" x="-300" y="-300" width="1600" height="850">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <style>
      .t { font: 700 52px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2937; letter-spacing: 0.5px; }
      .s { font: 500 18px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4b5563; }
      @media (prefers-color-scheme: dark) { .t { fill: #ffffff; } .s { fill: #d1d5db; } }
    </style>
  </defs>
  <g filter="url(#soft)">
