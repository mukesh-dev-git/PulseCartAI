      <animate attributeName="ry" values="120;95;140;120" keyTimes="0;0.34;0.67;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" dur="10.4s" begin="-4s" repeatCount="indefinite"/>
